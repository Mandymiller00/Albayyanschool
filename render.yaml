services:
  - type: web
    name: albayyan-school-pilot
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build && mkdir -p .next/standalone/.next && cp -R .next/static .next/standalone/.next/static && cp -R public .next/standalone/public
    startCommand: node .next/standalone/server.js
    healthCheckPath: /signin
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXTAUTH_URL
        value: https://albayyanschool.onrender.com
      - key: NEXTAUTH_SECRET
        sync: false
      - key: DEMO_LOGIN_ENABLED
        value: "false"
      - key: NEXT_PUBLIC_DEMO_LOGIN_ENABLED
        value: "false"
